# Date Reminder · Cloudflare Workers 配置
#
# 说明：`id` 留空时无法部署；首次部署前请在 Cloudflare 后台创建 KV 命名空间，
# 然后把它的 ID 填到下面的 id 字段（部署教程里有逐步说明）。

name = "date-reminder"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 静态资源（favicon 等），不参与业务逻辑
[assets]
directory = "./public"
binding = "ASSETS"

# 数据存储：提醒、规则、日志、配置全部存在这个 KV 里
[[kv_namespaces]]
binding = "SUBSCRIPTIONS_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# 每小时整点执行一次到期检查（UTC 时间，按配置里的时区换算）
[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "production"
