<style>
/* ===========================================================================
   Date Reminder · 设计系统
   - 商务风格：深海军蓝侧栏 + 浅灰画布 + 白色卡片 + 单一品牌蓝
   - 纯手写 CSS，无外部 CDN 依赖（国内访问稳定）
   - 深色模式通过 html[data-theme="dark"] 切换变量
   =========================================================================== */

:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f9fafb;
  --surface-3: #f2f4f7;

  --border: #e4e7ec;
  --border-strong: #d0d5dd;

  --text: #101828;
  --text-2: #475467;
  --text-3: #667085;

  --brand: #1b4d89;
  --brand-hover: #153d6d;
  --brand-soft: #edf3fa;
  --brand-border: #cfe0f2;

  --nav-bg: #0f2a44;
  --nav-bg-2: #0b2137;
  --nav-text: #b9c9db;
  --nav-text-strong: #ffffff;
  --nav-active-bg: rgba(255, 255, 255, 0.1);

  --ok: #067647;   --ok-bg: #ecfdf3;   --ok-border: #abefc6;
  --warn: #b54708; --warn-bg: #fffaeb; --warn-border: #fedf89;
  --danger: #b42318; --danger-bg: #fef3f2; --danger-border: #fecdca;
  --info: #175cd3; --info-bg: #eff8ff; --info-border: #b2ddff;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
  --shadow-md: 0 4px 10px -2px rgba(16, 24, 40, 0.08), 0 2px 4px -2px rgba(16, 24, 40, 0.04);
  --shadow-lg: 0 24px 48px -16px rgba(16, 24, 40, 0.24);

  --r-xs: 4px;
  --r-sm: 6px;
  --r: 8px;
  --r-lg: 12px;

  --sidebar-w: 232px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
}

html[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #121a2a;
  --surface-2: #0f1724;
  --surface-3: #1a2436;

  --border: #243044;
  --border-strong: #33415a;

  --text: #e8edf5;
  --text-2: #a9b6c8;
  --text-3: #8595ab;

  --brand: #4a8bd6;
  --brand-hover: #5c9be3;
  --brand-soft: #16273d;
  --brand-border: #26415f;

  --nav-bg: #0a1523;
  --nav-bg-2: #070f19;
  --nav-text: #93a4b8;
  --nav-active-bg: rgba(255, 255, 255, 0.08);

  --ok: #75e0a7;   --ok-bg: #0c2a1e;   --ok-border: #14532d;
  --warn: #fec84b; --warn-bg: #2b1d05; --warn-border: #4e3a0b;
  --danger: #fda29b; --danger-bg: #2c1210; --danger-border: #55160f;
  --info: #84caff; --info-bg: #10243d; --info-border: #1b3a5f;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 10px -2px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 24px 48px -16px rgba(0, 0, 0, 0.7);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }

h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }

/* ── 工具类 ───────────────────────────────────────────────────────────── */
.flex { display: flex; }
.inline-flex { display: inline-flex; }
.between { justify-content: space-between; }
.center { align-items: center; }
.gap-4 { gap: 4px; }
.gap-6 { gap: 6px; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.grow { flex: 1 1 auto; }
.wrap { flex-wrap: wrap; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-4 { margin-bottom: 4px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.muted { color: var(--text-3); }
.text-2 { color: var(--text-2); }
.small { font-size: 12.5px; }
.xs { font-size: 12px; }
.strong { font-weight: 600; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }
.right { text-align: right; }
.clickable { cursor: pointer; }

/* ── 应用骨架 ─────────────────────────────────────────────────────────── */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: linear-gradient(180deg, var(--nav-bg) 0%, var(--nav-bg-2) 100%);
  color: var(--nav-text);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 30;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 18px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}
.brand-mark {
  width: 34px; height: 34px;
  border-radius: var(--r);
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.14);
  display: grid; place-items: center;
  color: #fff;
  flex: 0 0 auto;
}
.brand-mark svg { width: 19px; height: 19px; }
.brand-name { color: #fff; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.brand-sub { color: rgba(255, 255, 255, 0.5); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }

.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; overflow-y: auto; }
.nav-label {
  font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
  color: rgba(255, 255, 255, 0.34);
  padding: 14px 10px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  border-radius: var(--r-sm);
  color: var(--nav-text);
  font-size: 13.5px;
  transition: background 0.15s, color 0.15s;
}
.nav-item:hover { background: rgba(255, 255, 255, 0.06); color: var(--nav-text-strong); text-decoration: none; }
.nav-item.active { background: var(--nav-active-bg); color: var(--nav-text-strong); box-shadow: inset 2px 0 0 #7fb3e8; }
.nav-item svg { width: 16px; height: 16px; opacity: 0.85; flex: 0 0 auto; }
.nav-item.active svg { opacity: 1; }

.sidebar-foot { padding: 12px; border-top: 1px solid rgba(255, 255, 255, 0.07); }
.user-chip {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: var(--r-sm);
  background: rgba(255, 255, 255, 0.05);
  color: #fff; font-size: 13px;
}
.user-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: #7fb3e8; color: #0f2a44;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700;
  flex: 0 0 auto;
}
.sidebar-foot .link-quiet { color: rgba(255, 255, 255, 0.55); font-size: 12px; }
.sidebar-foot .link-quiet:hover { color: #fff; text-decoration: none; }

.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 28px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  position: sticky; top: 0; z-index: 20;
}
.topbar h1 { font-size: 19px; }
.topbar .sub { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.content { padding: 24px 28px 56px; max-width: 1240px; width: 100%; }

/* ── 卡片 ─────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 16px; }
.card-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.card-head h3 { font-size: 14.5px; }
.card-head .desc { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
.card-body { padding: 18px; }
.card-body.tight { padding: 12px 18px; }
.card-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
}

/* ── 统计块 ───────────────────────────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
}
.stat .label { color: var(--text-3); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.stat .value { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; }
.stat .value .unit { font-size: 13px; font-weight: 500; color: var(--text-3); margin-left: 3px; }
.stat .foot { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.stat.accent { border-color: var(--brand-border); background: var(--brand-soft); }

/* ── 按钮 ─────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
}
.btn:hover { background: var(--surface-3); text-decoration: none; }
.btn:active { transform: translateY(0.5px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }

.btn-primary {
  background: var(--brand); border-color: var(--brand); color: #fff;
  box-shadow: 0 1px 2px rgba(27, 77, 137, 0.25);
}
.btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
html[data-theme="dark"] .btn-primary { color: #07121f; }
html[data-theme="dark"] .btn-primary:hover { color: #07121f; }

.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-3); color: var(--text); }

.btn-danger { background: transparent; border-color: var(--danger-border); color: var(--danger); }
.btn-danger:hover { background: var(--danger-bg); }

.btn-sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn-xs { height: 24px; padding: 0 8px; font-size: 12px; border-radius: var(--r-xs); }
.btn-icon { width: 30px; height: 30px; padding: 0; }
.btn-block { width: 100%; }

/* ── 表单 ─────────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: 12.5px; font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: 5px; }
.label .req { color: var(--danger); }
.label .hint { font-weight: 400; color: var(--text-3); }

.input, .select, .textarea {
  width: 100%;
  height: 36px;
  padding: 0 10px;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  appearance: none;
}
.textarea { height: auto; padding: 8px 10px; resize: vertical; min-height: 64px; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(27, 77, 137, 0.12);
}
html[data-theme="dark"] .input:focus,
html[data-theme="dark"] .select:focus,
html[data-theme="dark"] .textarea:focus { box-shadow: 0 0 0 3px rgba(74, 139, 214, 0.22); }
.input::placeholder, .textarea::placeholder { color: var(--text-3); opacity: 0.8; }
.input:disabled, .select:disabled { background: var(--surface-3); color: var(--text-3); cursor: not-allowed; }
.select {
  background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 8px center;
  padding-right: 28px;
}
.input-sm { height: 30px; font-size: 12.5px; }
.help { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.error-text { font-size: 12px; color: var(--danger); }
.input.invalid { border-color: var(--danger); }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.span-2 { grid-column: span 2; }
.span-3 { grid-column: span 3; }

/* 开关 */
.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track {
  width: 36px; height: 20px; border-radius: 999px;
  background: var(--border-strong);
  position: relative; transition: background 0.18s;
  flex: 0 0 auto;
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  transition: transform 0.18s;
}
.switch input:checked + .track { background: var(--brand); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { box-shadow: 0 0 0 3px rgba(27, 77, 137, 0.18); }
.switch .switch-text { font-size: 13px; color: var(--text-2); }

/* 分段选择 */
.segmented {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
}
.segmented button {
  border: 0; background: transparent; cursor: pointer;
  font-family: inherit; font-size: 13px; color: var(--text-2);
  padding: 5px 12px; border-radius: var(--r-xs);
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.segmented button:hover { color: var(--text); }
.segmented button.active {
  background: var(--surface); color: var(--text); font-weight: 500;
  box-shadow: var(--shadow-sm);
}

/* ── 徽标 ─────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px;
  border-radius: 999px;
  font-size: 11.5px; font-weight: 500;
  border: 1px solid transparent;
  white-space: nowrap;
}
.badge-neutral { background: var(--surface-3); color: var(--text-2); border-color: var(--border); }
.badge-ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
.badge-warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.badge-danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.badge-info { background: var(--info-bg); color: var(--info); border-color: var(--info-border); }
.badge-brand { background: var(--brand-soft); color: var(--brand); border-color: var(--brand-border); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }

/* ── 表格 ─────────────────────────────────────────────────────────────── */
.table-wrap { width: 100%; overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table thead th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-3);
  background: var(--surface-2);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.table tbody td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--text-2);
}
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: var(--surface-2); }
.table .primary-cell { color: var(--text); font-weight: 500; }
.table .actions { display: flex; gap: 4px; justify-content: flex-end; }

.empty {
  padding: 56px 20px;
  text-align: center;
  color: var(--text-3);
}
.empty .empty-icon {
  width: 44px; height: 44px; margin: 0 auto 12px;
  border-radius: 50%;
  background: var(--surface-3);
  display: grid; place-items: center;
  color: var(--text-3);
}
.empty h4 { color: var(--text-2); font-size: 14px; margin-bottom: 4px; }

/* ── 弹窗 ─────────────────────────────────────────────────────────────── */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(16, 24, 40, 0.5);
  backdrop-filter: blur(2px);
  display: none;
  align-items: flex-start; justify-content: center;
  padding: 40px 16px;
  z-index: 100;
  overflow-y: auto;
}
.modal-mask.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 780px;
  margin: auto;
  border: 1px solid var(--border);
  animation: modal-in 0.16s ease-out;
}
.modal.narrow { max-width: 460px; }
@keyframes modal-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.modal-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.modal-head h3 { font-size: 16px; }
.modal-head .desc { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
.modal-body { padding: 20px; max-height: calc(100vh - 220px); overflow-y: auto; }
.modal-foot {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
  background: var(--surface-2);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
}

.form-section + .form-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border); }
.form-section-title {
  font-size: 12.5px; font-weight: 600; color: var(--text-3);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}

/* ── Toast ────────────────────────────────────────────────────────────── */
#toastHost {
  position: fixed; right: 20px; bottom: 20px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 200;
  pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 9px;
  min-width: 220px; max-width: 380px;
  padding: 11px 14px;
  border-radius: var(--r);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  font-size: 13px;
  color: var(--text);
  animation: toast-in 0.18s ease-out;
  pointer-events: auto;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.toast.ok { border-left: 3px solid var(--ok); }
.toast.err { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--brand); }

/* ── 规则编辑器 ───────────────────────────────────────────────────────── */
.rule-list { display: flex; flex-direction: column; gap: 8px; }
.rule-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
}
.rule-row.off { opacity: 0.55; }
.rule-row .input, .rule-row .select { height: 30px; font-size: 12.5px; width: auto; }
.rule-row .w-num { width: 66px; }
.rule-row .w-unit { width: 76px; }
.rule-row .w-type { width: 120px; }
.rule-sep { color: var(--text-3); font-size: 12px; }
.window-pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--brand-soft);
  border: 1px solid var(--brand-border);
  color: var(--brand);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 12px;
}

/* ── 渠道配置卡 ───────────────────────────────────────────────────────── */
.channel { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.channel + .channel { margin-top: 14px; }
.channel.open { border-color: var(--brand-border); box-shadow: 0 0 0 3px rgba(27, 77, 137, 0.06); }
.channel-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  cursor: pointer;

<script>
  /* 主题引导：尽早执行，避免首屏闪烁 */
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('dr-theme'); } catch (e) {}
    var mode = stored || 'light';
    if (mode === 'system') {
      mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');

    window.DR = window.DR || {};
    window.DR.getTheme = function () {
      return localStorage.getItem('dr-theme') || 'light';
    };
    window.DR.setTheme = function (next) {
      try { localStorage.setItem('dr-theme', next); } catch (e) {}
      var resolved = next;
      if (next === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', resolved === 'dark' ? 'dark' : 'light');
    };
  })();
</script>
